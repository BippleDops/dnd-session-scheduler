services:
  dnd-api:
    build:
      context: ./apps/api
    container_name: dnd-api
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - dnd-internal
      - n8n-network
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dnd-web:
    build:
      context: ./apps/web
    container_name: dnd-web
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3001:80"
    depends_on:
      dnd-api:
        condition: service_healthy
    networks:
      - dnd-internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  sqlitebrowser:
    image: lscr.io/linuxserver/sqlitebrowser:latest
    container_name: sqlite-viewer
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - CUSTOM_USER=${SQLITE_BROWSER_USER:-admin}
      - PASSWORD=${SQLITE_BROWSER_PASS:-changeme}
    volumes:
      - ./data:/databases:ro
    shm_size: "1gb"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "127.0.0.1:3003:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - n8n-network

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  dnd-internal:
    driver: bridge
  n8n-network:
    external: true
    name: n8n_n8n-network
