# Variables are read from ./.env (copy apps/api/env.example there for Docker deployments).
# Hosts that run the n8n stack can attach dnd-api/uptime-kuma to its network with:
#   docker compose -f docker-compose.yml -f docker-compose.n8n.yml up -d
services:
  dnd-api:
    build:
      context: ./apps/api
    container_name: dnd-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - SCHEDULER_TIMEZONE=${SCHEDULER_TIMEZONE:-America/Chicago}
    volumes:
      # The container runs as the unprivileged `node` user (uid 1000); ./data must be writable by it.
      - ./data:/app/data
    networks:
      - dnd-internal
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dnd-web:
    build:
      context: ./apps/web
      args:
        # Baked into the static export (metadata / canonical URLs). Defaults to BASE_URL.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${BASE_URL:-http://localhost:3001}}
    container_name: dnd-web
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      dnd-api:
        condition: service_healthy
    networks:
      - dnd-internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  sqlitebrowser:
    image: lscr.io/linuxserver/sqlitebrowser:latest
    container_name: sqlite-viewer
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${SCHEDULER_TIMEZONE:-America/Chicago}
      # Required: no default credentials. Set both in .env.
      - CUSTOM_USER=${SQLITE_BROWSER_USER:?Set SQLITE_BROWSER_USER in .env}
      - PASSWORD=${SQLITE_BROWSER_PASS:?Set SQLITE_BROWSER_PASS in .env}
    volumes:
      - ./data:/databases:ro
    shm_size: "1gb"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - dnd-internal

networks:
  dnd-internal:
    driver: bridge
